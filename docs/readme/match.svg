<style>svg { --bg:#fafafa; --sf:#ffffff; --mu:#f5f5f5; --bd:#e5e5e5; --bds:#d4d4d4; --fg:#171717; --fgm:#525252; --fgs:#6e6e6e; --ac:#003200; --acf:#ffffff; --act:#1a6e38; --acs:#edf5ef; --acsb:#cfe5d5; --ok:#0e6f80; --okb:#ecfeff; --wa:#b45309; --wab:#fffbeb; --wabd:#fde68a; --tr:#ececec; --paper:#ffffff; --pfg:#171717; --pbar:#d4d4d4; --g1:#4285f4; --g2:#9b72cb; --g3:#d96570; --g4:#f2a60c; --g5:#34a853; }
@media (prefers-color-scheme: dark) { svg { --bg:#0a0a0a; --sf:#121212; --mu:#1a1a1a; --bd:#2a2a2a; --bds:#3a3a3a; --fg:#ededed; --fgm:#a1a1a1; --fgs:#8a8a8a; --ac:#5fd38a; --acf:#003200; --act:#5fd38a; --acs:#0f2416; --acsb:#1d4a2b; --ok:#67e8f9; --okb:#0a2329; --wa:#fbbf24; --wab:#211a08; --wabd:#5c4512; --tr:#262626; --g1:#6ea2ff; --g2:#b18ce0; --g3:#ec7f8a; --g4:#f6bb3c; --g5:#56c271; } }
text { font-family: Geist, Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.bg { fill: var(--bg); } .sf { fill: var(--sf); } .mu { fill: var(--mu); } .ac { fill: var(--ac); } .acs { fill: var(--acs); } .paper { fill: var(--paper); }
.bd { stroke: var(--bd); } .bds { stroke: var(--bds); }
.fg { fill: var(--fg); } .fgm { fill: var(--fgm); } .fgs { fill: var(--fgs); } .act { fill: var(--act); } .acf { fill: var(--acf); } .pfg { fill: var(--pfg); } .pbar { fill: var(--pbar); }
* { transform-box: fill-box; animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1); }

.rise { animation: rise 10s infinite backwards; }
.arc { animation: arc 10s infinite; }
.num { animation: num 10s infinite; }
.btn { transform-origin: 50% 50%; animation: btn 10s infinite; }
.dlg { animation: dlg 10s infinite; transform-origin: 50% 0; }
.acc rect { animation: accbg 10s infinite; } .acc text { animation: acctx 10s infinite; }
.swfill { transform-origin: 82% 50%; animation: off 10s infinite; }
.knob { animation: knob 10s infinite; }
.dim { animation: dim 10s infinite; }
.glow { animation: glow 10s infinite; }
.before { animation: before 10s infinite; } .after { animation: after 10s infinite; }
@keyframes rise { 0% { opacity: 0; transform: translateY(4px); } 3%, 94% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
@keyframes arc { 0%, 2% { stroke-dashoffset: 182.2; } 16%, 95% { stroke-dashoffset: 29.2; } 100% { stroke-dashoffset: 182.2; } }
@keyframes num { 0%, 9% { opacity: 0; } 15%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
@keyframes btn { 0%, 21% { transform: none; } 22.5% { transform: scale(.97); } 24%, 100% { transform: none; } }
@keyframes dlg { 0%, 24% { opacity: 0; transform: scale(.95); } 27%, 93% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: scale(.95); } }
@keyframes accbg { 0%, 46% { fill: var(--sf); } 47%, 52% { fill: var(--mu); } 54%, 100% { fill: var(--sf); } }
@keyframes acctx { 0%, 46% { fill: var(--fg); } 47%, 100% { fill: var(--fgm); } }
@keyframes off { 0%, 49% { transform: scale(1); } 52%, 100% { transform: scale(0); } }
@keyframes knob { 0%, 49% { transform: none; } 52%, 100% { transform: translateX(-14px); } }
@keyframes dim { 0%, 49% { opacity: 1; } 52%, 100% { opacity: .55; } }
@keyframes glow { 0%, 49% { opacity: 1; } 53%, 100% { opacity: 0; } }
@keyframes before { 0%, 53% { opacity: 1; filter: blur(0); } 56%, 100% { opacity: 0; filter: blur(2px); } }
@keyframes after { 0%, 54% { opacity: 0; filter: blur(2px); } 57%, 100% { opacity: 1; filter: blur(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .arc { stroke-dashoffset: 29.2; } .before { opacity: 0; } }
