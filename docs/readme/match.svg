<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Job Match scores a posting at 84, a strong fit, with its must-have skills. Tailor résumé opens a list of library items; an AI suggestion to exclude an unrelated skills row is accepted and the résumé goes from two pages to one.">
