<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="The Chrome extension on a job posting: one click saves it to the Job Tracker and the side panel shows an 84, strong fit, and what would raise it. On the application form, Auto Fill fills the fields, attaches the résumé PDF and drafts an open question with AI in a dashed outline. It never submits.">
<title>The Chrome extension on a job posting: one click saves it to the Job Tracker and the side panel shows an 84, strong fit, and what would raise it. On the application form, Auto Fill fills the fields, attaches the résumé PDF and drafts an open question with AI in a dashed outline. It never submits.</title>
