<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="A library of experience rows, each with a switch. Switching off Research Assistant removes it from the typeset résumé page beside the list, and the sections below it move up.">
<title>A library of experience rows, each with a switch. Switching off Research Assistant removes it from the typeset résumé page beside the list, and the sections below it move up.</title>
<style>svg { --bg:#fafafa; --sf:#ffffff; --mu:#f5f5f5; --bd:#e5e5e5; --bds:#d4d4d4; --fg:#171717; --fgm:#525252; --fgs:#6e6e6e; --ac:#003200; --acf:#ffffff; --act:#1a6e38; --acs:#edf5ef; --acsb:#cfe5d5; --ok:#0e6f80; --okb:#ecfeff; --wa:#b45309; --wab:#fffbeb; --wabd:#fde68a; --tr:#ececec; --paper:#ffffff; --pfg:#171717; --pbar:#d4d4d4; --g1:#4285f4; --g2:#9b72cb; --g3:#d96570; --g4:#f2a60c; --g5:#34a853; }
@media (prefers-color-scheme: dark) { svg { --bg:#0a0a0a; --sf:#121212; --mu:#1a1a1a; --bd:#2a2a2a; --bds:#3a3a3a; --fg:#ededed; --fgm:#a1a1a1; --fgs:#8a8a8a; --ac:#5fd38a; --acf:#003200; --act:#5fd38a; --acs:#0f2416; --acsb:#1d4a2b; --ok:#67e8f9; --okb:#0a2329; --wa:#fbbf24; --wab:#211a08; --wabd:#5c4512; --tr:#262626; --g1:#6ea2ff; --g2:#b18ce0; --g3:#ec7f8a; --g4:#f6bb3c; --g5:#56c271; } }
text { font-family: Geist, -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.bg { fill: var(--bg); } .sf { fill: var(--sf); } .mu { fill: var(--mu); } .ac { fill: var(--ac); } .acs { fill: var(--acs); } .paper { fill: var(--paper); }
.bd { stroke: var(--bd); } .bds { stroke: var(--bds); }
.fg { fill: var(--fg); } .fgm { fill: var(--fgm); } .fgs { fill: var(--fgs); } .act { fill: var(--act); } .acf { fill: var(--acf); } .pfg { fill: var(--pfg); } .pbar { fill: var(--pbar); }
* { animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1); }
.fill, .swfill, .btn, .press, .fab, .dlg, .spin, .review, .cursor path, .cur path { transform-box: fill-box; }

.fill { transform-origin: 82% 50%; animation: fill 8s infinite; }
.knob { animation: knob 8s infinite; }
.ttl { animation: ttl 8s infinite; }
.leave { animation: leave 8s infinite; }
.shift { animation: shift 8s infinite; }
.cursor { animation: cursor 8s infinite; }
.cursor path { transform-origin: 0 0; animation: press 8s infinite; }
@keyframes fill { 0%, 25% { transform: scale(1); } 28%, 70% { transform: scale(0); } 73%, 100% { transform: scale(1); } }
@keyframes knob { 0%, 25% { transform: none; } 28%, 70% { transform: translateX(-14px); } 73%, 100% { transform: none; } }
@keyframes ttl { 0%, 25% { fill: var(--fg); } 28%, 70% { fill: var(--fgm); } 73%, 100% { fill: var(--fg); } }
@keyframes leave { 0%, 26% { opacity: 1; } 29%, 73% { opacity: 0; } 77%, 100% { opacity: 1; } }
@keyframes shift { 0%, 28% { transform: none; } 32%, 70% { transform: translateY(-24px); } 74%, 100% { transform: none; } }
@keyframes cursor {
  0% { transform: translate(250px, 290px); opacity: 0; }
  8% { opacity: 1; }
  20%, 30% { transform: translate(388px, 180px); opacity: 1; }
  42%, 52% { transform: translate(250px, 280px); opacity: 1; }
  64%, 75% { transform: translate(388px, 180px); opacity: 1; }
  88% { opacity: 0; }
  100% { transform: translate(250px, 290px); opacity: 0; }
}
@keyframes press { 0%, 23% { transform: none; } 24.5% { transform: scale(.85); } 26%, 68% { transform: none; } 69.5% { transform: scale(.85); } 71%, 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .cursor { display: none; } }
</style>
