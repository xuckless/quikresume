<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="A résumé PDF drops into the import card and Analyse résumé runs. The review lists what was found, each item labelled New, Adds detail or Already in library, ready to add to the editor.">
<title>A résumé PDF drops into the import card and Analyse résumé runs. The review lists what was found, each item labelled New, Adds detail or Already in library, ready to add to the editor.</title>
<style>svg { --bg:#fafafa; --sf:#ffffff; --mu:#f5f5f5; --bd:#e5e5e5; --bds:#d4d4d4; --fg:#171717; --fgm:#525252; --fgs:#6e6e6e; --ac:#003200; --acf:#ffffff; --act:#1a6e38; --acs:#edf5ef; --acsb:#cfe5d5; --ok:#0e6f80; --okb:#ecfeff; --wa:#b45309; --wab:#fffbeb; --wabd:#fde68a; --tr:#ececec; --paper:#ffffff; --pfg:#171717; --pbar:#d4d4d4; --g1:#4285f4; --g2:#9b72cb; --g3:#d96570; --g4:#f2a60c; --g5:#34a853; }
@media (prefers-color-scheme: dark) { svg { --bg:#0a0a0a; --sf:#121212; --mu:#1a1a1a; --bd:#2a2a2a; --bds:#3a3a3a; --fg:#ededed; --fgm:#a1a1a1; --fgs:#8a8a8a; --ac:#5fd38a; --acf:#003200; --act:#5fd38a; --acs:#0f2416; --acsb:#1d4a2b; --ok:#67e8f9; --okb:#0a2329; --wa:#fbbf24; --wab:#211a08; --wabd:#5c4512; --tr:#262626; --g1:#6ea2ff; --g2:#b18ce0; --g3:#ec7f8a; --g4:#f6bb3c; --g5:#56c271; } }
text { font-family: Geist, Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.bg { fill: var(--bg); } .sf { fill: var(--sf); } .mu { fill: var(--mu); } .ac { fill: var(--ac); } .acs { fill: var(--acs); } .paper { fill: var(--paper); }
.bd { stroke: var(--bd); } .bds { stroke: var(--bds); }
.fg { fill: var(--fg); } .fgm { fill: var(--fgm); } .fgs { fill: var(--fgs); } .act { fill: var(--act); } .acf { fill: var(--acf); } .pfg { fill: var(--pfg); } .pbar { fill: var(--pbar); }
* { transform-box: fill-box; animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1); }

.file { animation: file 9s infinite; }
.hint { animation: hint 9s infinite; }
.press { transform-origin: 50% 50%; animation: press 9s infinite; }
.l1 { animation: l1 9s infinite; } .l2 { animation: l2 9s infinite; }
.spin { transform-origin: 50% 50%; animation: spin 700ms linear infinite; }
.review { animation: review 9s infinite; }
.row { animation: row 9s infinite backwards; }
@keyframes file { 0% { opacity: 0; transform: translateY(-26px); } 4% { opacity: 0; transform: translateY(-26px); } 12%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
@keyframes hint { 0%, 6% { opacity: 1; } 10%, 95% { opacity: 0; } 100% { opacity: 1; } }
@keyframes press { 0%, 17% { transform: none; } 18.5% { transform: scale(.97); } 20%, 100% { transform: none; } }
@keyframes l1 { 0%, 19% { opacity: 1; filter: blur(0); } 21%, 44% { opacity: 0; filter: blur(2px); } 47%, 100% { opacity: 1; filter: blur(0); } }
@keyframes l2 { 0%, 19% { opacity: 0; filter: blur(2px); } 22%, 44% { opacity: 1; filter: blur(0); } 46%, 100% { opacity: 0; filter: blur(2px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes review { 0%, 44% { opacity: 0; transform: scale(.98); } 47%, 93% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
@keyframes row { 0%, 46% { opacity: 0; transform: translateY(6px); } 50%, 100% { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .hint, .l2 { opacity: 0; } }
</style>
<rect x=".5" y=".5" width="719" height="359" rx="8" class="bg bd"/>
<rect x="16.5" y="16.5" width="283" height="327" rx="8" class="sf bd"/>
<text x="32" y="42" font-size="13.5" font-weight="600" class="fg">Import existing résumés</text>
<text x="32" y="60" font-size="11.5" class="fgs">PDF, Word, text or a photo. Nothing is saved yet.</text>
<rect x="32.5" y="74.5" width="251" height="139" rx="8" fill="none" class="bds" stroke-dasharray="4 3"/>
<g class="hint">
<rect x="142.5" y="98.5" width="31" height="31" rx="6" class="sf bd"/>
<path d="M158 120v-12m-4.5 4.5L158 108l4.5 4.5M151.5 121.5h13" fill="none" stroke="var(--fg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="158" y="152" font-size="12.5" font-weight="500" text-anchor="middle" class="fg">Drop your résumés here</text>
<text x="158" y="170" font-size="11" text-anchor="middle" class="fgs">PDF · DOCX · TXT · PNG / JPG</text>
</g>
<g class="file">
<rect x="56.5" y="122.5" width="203" height="41" rx="6" class="sf bd"/>
<path d="M70 132h10l5 5v17h-15z" class="mu" stroke="var(--bds)"/><path d="M80 132v5h5" fill="none" stroke="var(--bds)"/>
<text x="94" y="140" font-size="12.5" font-weight="500" class="fg">alex-morgan-2024.pdf</text>
<text x="94" y="156" font-size="11" class="fgs mono">412 KB · 2 pages</text>
</g>
<rect x="32.5" y="230.5" width="174" height="31" rx="6" class="sf bd"/>
<rect x="45" y="239" width="14" height="14" rx="2.5" class="fgm"/><text x="52" y="250" font-size="9.5" font-weight="700" text-anchor="middle" class="sf">in</text>
<text x="67" y="250.5" font-size="12.5" font-weight="500" class="fg">Import from LinkedIn</text>
<line x1="16" x2="300" y1="294" y2="294" class="bd"/>
<text x="112" y="320" font-size="12.5" font-weight="500" text-anchor="middle" class="fgm">Cancel</text>
<g class="press"><rect x="146" y="304" width="138" height="28" rx="6" class="ac"/>
<text class="l1 acf" x="215" y="322.5" font-size="12.5" font-weight="500" text-anchor="middle">Analyse résumé</text>
<g class="l2" opacity="0"><circle class="spin" cx="185" cy="318" r="5" fill="none" stroke="var(--acf)" stroke-width="1.6" stroke-dasharray="20 12"/><text x="222" y="322.5" font-size="12.5" font-weight="500" text-anchor="middle" class="acf">Analysing</text></g></g>
<g class="review">
<rect x="316.5" y="16.5" width="387" height="327" rx="8" class="sf bd"/>
<text x="334" y="42" font-size="13.5" font-weight="600" class="fg">Review what we found</text>
<text x="334" y="60" font-size="11.5" class="fgs">Untick anything you do not want. Duplicates are merged.</text>
<text x="334" y="88" font-size="12" font-weight="600" class="fgm">Experience</text>
<g class="row" style="animation-delay:0ms"><g><rect x="334" y="99" width="14" height="14" rx="3" class="ac"/><path d="M337.5 106 l2.6 2.6 l4.8 -5.2" fill="none" stroke="var(--acf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="110" font-size="13.5" font-weight="500" class="fg">Software Engineering Intern</text><rect x="565.1" y="98" width="34" height="18" rx="4" style="fill:var(--okb)"/><text x="582.1" y="110.5" font-size="11" font-weight="500" text-anchor="middle" style="fill:var(--ok)">New</text><text x="360" y="127" font-size="12.5" class="fgm">Northwind Cloud · Jun – Aug 2025</text></g></g>
<g class="row" style="animation-delay:140ms"><g><rect x="334" y="139" width="14" height="14" rx="3" class="ac"/><path d="M337.5 146 l2.6 2.6 l4.8 -5.2" fill="none" stroke="var(--acf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="150" font-size="13.5" font-weight="500" class="fg">Backend Engineering Intern</text><rect x="557.8" y="138" width="72" height="18" rx="4" style="fill:var(--mu)"/><text x="593.8" y="150.5" font-size="11" font-weight="500" text-anchor="middle" style="fill:var(--fgm)">Adds detail</text><text x="360" y="167" font-size="12.5" class="fgm">Contoso Health · 2 new bullets</text></g></g>
<g class="row" style="animation-delay:280ms"><g opacity=".6"><rect x="334.5" y="179.5" width="13" height="13" rx="2.5" class="sf bds"/><text x="360" y="190" font-size="13.5" font-weight="500" class="fg">Barista</text><rect x="419.1" y="178" width="112" height="18" rx="4" style="fill:var(--mu)"/><text x="475.1" y="190.5" font-size="11" font-weight="500" text-anchor="middle" style="fill:var(--fgs)">Already in library</text><text x="360" y="207" font-size="12.5" class="fgm">Blue Bottle Coffee · 2022 – 2023</text></g></g>
<text x="334" y="236" font-size="12" font-weight="600" class="fgm">Projects</text>
<g class="row" style="animation-delay:420ms"><g><rect x="334" y="247" width="14" height="14" rx="3" class="ac"/><path d="M337.5 254 l2.6 2.6 l4.8 -5.2" fill="none" stroke="var(--acf)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="258" font-size="13.5" font-weight="500" class="fg">Support Ticket Classifier</text><rect x="550.5" y="246" width="34" height="18" rx="4" style="fill:var(--okb)"/><text x="567.5" y="258.5" font-size="11" font-weight="500" text-anchor="middle" style="fill:var(--ok)">New</text><text x="360" y="275" font-size="12.5" class="fgm">PyTorch, FastAPI, AWS Lambda</text></g></g>
<line x1="316" x2="704" y1="294" y2="294" class="bd"/>
<text x="498" y="322.5" font-size="12.5" font-weight="500" text-anchor="middle" class="fgm">Start over</text>
<rect x="534" y="304" width="154" height="28" rx="6" class="ac"/><text x="611" y="322.5" font-size="12.5" font-weight="500" text-anchor="middle" class="acf">Add 3 items to the editor</text>
</g>
</svg>
